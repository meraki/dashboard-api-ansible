---
# Indirect node counting queries for the cisco.meraki collection.
#
# These jq expressions run inside the Automation Platform controller
# (awx/main/tasks/host_indirect.py) against each module's result, and their
# output feeds subscription node counting. Nothing in this repository executes
# them, so tests/unit/queries/test_event_query_contract.py asserts the
# contract the controller imposes on the output.
#
# TWO RULES WHOSE COST IS THE WHOLE JOB
# -------------------------------------
# Most contract violations lose one node. These two lose every audit record
# for the job, including the modules that were correct -- and the job stays
# green while it happens.
#
# 1. EVERY TOP-LEVEL OUTPUT MUST BE AN OBJECT, NOT A LIST.
#    _process_jq_result calls data.get('canonical_facts') on each element of
#    compiled_jq.input(res).all(). A query that collects its records --
#    `[ ... ]`, `map(...)`, or an `else []` branch -- emits a single list, and
#    list.get raises AttributeError. _execute_jq_query does not catch it; it
#    wraps only the jq call itself, so the exception escapes
#    build_indirect_host_data and takes the job's whole transaction with it.
#
#    So: emit a stream. `.xs[] | {...}`, not `.xs | map({...})`; and
#    `else empty end`, not `else [] end`. The empty branch matters most: it is
#    the one every module takes when the task did not return a
#    meraki_response, which is most tasks in most jobs.
#
# 2. `name` MUST BE UNIQUE WITHIN A JOB, SO IT IS AN IDENTIFIER.
#    IndirectManagedNodeAudit declares unique_together = [('name', 'job')] and
#    the controller bulk_create()s a job's records in one transaction. Two
#    records that deduplicate apart on canonical_facts but share a `name`
#    raise IntegrityError, which rolls back the transaction and reverts
#    event_queries_processed with it -- so the fallback task re-picks the job
#    and fails identically until it ages out.
#
#    This is the rule that opposes the obvious instinct. A Meraki device name
#    is a label an administrator types, and two switches called `switch`, or
#    two unnamed devices, or two ACL rules with the same comment, are the
#    ordinary case. Every query below therefore emits its identifier -- the
#    serial, MAC, network id or composite key that canonical_facts already
#    uses -- as `name`, and reports the administrator's label in facts.name,
#    which carries no uniqueness constraint.
#
# getNetworkSwitchMtu - checked
cisco.meraki.networks_switch_mtu_info:
  query: >-
    if .meraki_response then
      .meraki_response |
      if .overrides and (.overrides | length > 0) then
        . as $parent |
        (
          $parent.overrides[] |
          . as $override |
          # Create entries for each switch serial
          ($override.switches // [])[] |
          select(. != null) |
          {
            name: (. | tostring),
            canonical_facts: {
              ansible_product_serial: (. | tostring)
            },
            facts: {
              infra_type: "private_cloud",
              infra_bucket: "networking",
              device_type: "switch",
              mtu_size: $override.mtuSize,
              default_mtu_size: $parent.defaultMtuSize
            }
          }
        )
      else empty
      end
    else empty
    end

# Devices
cisco.meraki.devices_info:
  query: >-
    if .meraki_response then
      .meraki_response | [.] | flatten |
      .[] | (select(.serial != null) | {
        name: .serial,
        canonical_facts: {
          ansible_product_serial: .serial
        },
        facts: {
          infra_type: "private_cloud",
          infra_bucket: "networking",
          device_type: ((.productType // "unknown") | gsub("(?<c>[A-Z])"; "_" + (.c | ascii_downcase))),
          meraki_network_id: .networkId,
          ansible_hostname: (.lanIp // ""),
          ansible_product_name: .model,
          ansible_bios_version: .firmware,
          macaddress: .mac,
          name: ((.name | select(. != "")) // (.productType + "-" + .serial))
        }
      })
    else empty
    end

