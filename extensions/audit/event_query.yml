              },
              ospf_config: {
                enabled: ($parent.v3.enabled // false),
                hello_timer: ($parent.v3.helloTimerInSeconds // 0),
                dead_timer: ($parent.v3.deadTimerInSeconds // 0)
              },
              vrf: (
                if $parent.vrf then
