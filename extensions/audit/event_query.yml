# Networks
#
# cisco.meraki.networks and cisco.meraki.networks_info deliberately have no
# audit query. A Meraki network is an administrative container, not a device,
# so counting one reports infrastructure that does not exist. The taxonomy
# article states this directly: "Do not emit audit records for organization-
# or network-scoped modules. A Meraki network is an administrative container,
# not a device; counting one inflates the node count."
#
# The switches, access points and appliances inside a network are reported by
# the device-scoped modules, keyed on their serial numbers.
#
# Network-scoped modules whose *response* yields device serials are a separate
# case and do keep their queries -- networks_switch_stacks_info reports one
# record per member serial from .serials[]. The test is whether the response
# identifies a device, not whether the endpoint is network-scoped.

# updateDevice does not seem to return productType field
cisco.meraki.devices:
  query: >-
    if .meraki_response then
      .meraki_response | [.] | flatten |
      .[] | (select(.serial != null) | {
        name: .serial,
        canonical_facts: {
          ansible_product_serial: .serial
        },
        facts: {
          infra_type: "private_cloud",
          infra_bucket: "networking",
          device_type: (if .model | startswith("MV") then "camera"
                    elif .model | startswith("MR") then "wireless"
                    elif .model | startswith("MS") then "switch"
                    elif .model | startswith("MX") then "appliance"
                    else "unknown"
                    end),
          meraki_network_id: .networkId,
          ansible_hostname: (.lanIp // ""),
          ansible_product_name: .model,
          ansible_bios_version: .firmware,
          macaddress: .mac,
          name: ((.name | select(. != "")) // (.model + "-" + .serial))
        }
      })
    else empty
    end
