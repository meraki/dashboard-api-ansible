---
# Publishes the collection to Ansible Galaxy and Red Hat Automation Hub
# when a GitHub release is published.
#
# Requires a GitHub environment named "release" with two secrets:
#   AH_TOKEN                Automation Hub token (console.redhat.com > Connect to Hub > Load token)
#   ANSIBLE_GALAXY_API_KEY  Ansible Galaxy API key
#
# The reusable workflow is pinned to a commit SHA (ansible/devtools v26.4.0)
# because it receives the publishing secrets. Bump it deliberately.
name: Release the ansible collection

permissions:
  contents: read

"on":
  release:
    types: [published]

jobs:
  release:
    uses: ansible/devtools/.github/workflows/release_collection.yml@e7604b7f0f487584a2264c09a0df1524fe2be49e # v26.4.0
    with:
      environment: release
    secrets:
      ah_token: ${{ secrets.AH_TOKEN }}
      ansible_galaxy_api_key: ${{ secrets.ANSIBLE_GALAXY_API_KEY }}
